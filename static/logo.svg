<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#fff5f8" stroke="#e91e63" stroke-width="2"/>

  <!-- Africa map outline (simplified) -->
  <g opacity="0.15">
    <path d="M 80 60 Q 85 55 90 60 L 100 50 L 110 65 Q 115 70 110 80 L 100 90 L 85 85 Z" fill="#667eea"/>
  </g>

  <!-- Main heart shape -->
  <path d="M 100 155 C 60 120 40 100 40 80 C 40 65 50 55 62 55 C 75 55 88 65 100 78 C 112 65 125 55 138 55 C 150 55 160 65 160 80 C 160 100 140 120 100 155 Z"
        fill="url(#heartGradient)" stroke="#c2185b" stroke-width="1.5"/>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e91e63;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Decorative stars for East Africa -->
  <circle cx="70" cy="70" r="3" fill="#667eea" opacity="0.6"/>
  <circle cx="130" cy="75" r="2.5" fill="#667eea" opacity="0.5"/>
  <circle cx="95" cy="50" r="2" fill="#667eea" opacity="0.4"/>
</svg>
