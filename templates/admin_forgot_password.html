<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Forgot Password - East African Hearts</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="form-container">
        <h2>Admin Password Reset</h2>
        <p class="form-subtitle">Enter your username to receive a password reset link</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="testimonial-form">
            <div class="form-group">
                <label for="username">Admin Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <button type="submit" class="btn-form">Send Reset Link</button>

            <div class="switch-link">
                <a href="{{ url_for('auth.admin_login') }}">Back to Login</a>
            </div>
        </form>
    </div>
</body>
</html>
