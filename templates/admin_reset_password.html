<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Admin Password - East African Hearts</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="form-container">
        <h2>Reset Admin Password</h2>
        <p class="form-subtitle">Enter your new password</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="testimonial-form">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required
                       minlength="8"
                       placeholder="Min 8 chars, 1 uppercase, 1 number, 1 special char">
            </div>

            <div class="form-group">
                <label for="password_confirm">Confirm Password</label>
                <input type="password" id="password_confirm" name="password_confirm" required>
            </div>

            <button type="submit" class="btn-form">Reset Password</button>

            <div class="switch-link">
                <a href="{{ url_for('auth.admin_login') }}">Back to Login</a>
            </div>
        </form>
    </div>
</body>
</html>
